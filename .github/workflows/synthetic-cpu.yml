name: Synthetic CPU pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: configs/environment-preprocessing.txt

      - name: Install CPU preparation and baseline dependencies
        run: |
          python -m pip install -r configs/environment-preprocessing.txt
          python -m pip check

      - name: Focused preprocessing and baseline unit checks
        run: |
          python -m unittest discover -s tests -p 'test_preprocessing.py' -v
          python -m unittest discover -s tests -p 'test_baselines.py' -v

      - name: Fresh-run pipeline on invented cell and drug records
        run: python -m unittest discover -s tests -p 'test_fresh_run.py' -v

      - name: Robustness runners on invented records
        run: |
          python -m unittest discover -s tests -p 'test_multisplit.py' -v
          python -m unittest discover -s tests -p 'test_pca_sensitivity.py' -v
